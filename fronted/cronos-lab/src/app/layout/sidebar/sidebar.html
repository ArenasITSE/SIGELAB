<div class="sidebar">

  <div class="logo-section">
    <img
      src="assets/logo-chronoslab.png"
      alt="SIGELAB"
      class="logo"
    />

    <span>SIGELAB</span>
  </div>

  <nav class="menu">

    <a routerLink="/dashboard" routerLinkActive="active">
      <i class="fas fa-home"></i>
      Dashboard
    </a>

    <div class="menu-title">
      GESTIÓN
    </div>

    <a routerLink="/laboratorios">
      <i class="fas fa-flask"></i>
      Laboratorios
    </a>

    <a routerLink="/solicitudes">
      <i class="fas fa-file-signature"></i>
      Solicitudes
    </a>

    <a routerLink="/calendario">
      <i class="fas fa-calendar"></i>
      Calendario
    </a>

    <a routerLink="/usuarios">
      <i class="fas fa-users"></i>
      Usuarios
    </a>

    <a routerLink="/carreras">
      <i class="fas fa-graduation-cap"></i>
      Carreras
    </a>

    <a routerLink="/docentes">
      <i class="fas fa-chalkboard-teacher"></i>
      Docentes
    </a>

    <a routerLink="/estudiantes">
      <i class="fas fa-user-graduate"></i>
      Estudiantes
    </a>

    <div class="menu-title">
      CONFIGURACIÓN
    </div>

    <a routerLink="/roles">
      <i class="fas fa-user-shield"></i>
      Roles y Permisos
    </a>

    <a routerLink="/parametros">
      <i class="fas fa-cogs"></i>
      Parámetros
    </a>

    <a routerLink="/bitacora">
      <i class="fas fa-clipboard-list"></i>
      Bitácora
    </a>

  </nav>

  <div class="user-section">

    <div class="user-info">
      <div class="avatar">
        {{ nombre?.charAt(0) }}
      </div>

      <div>
        <strong>{{ nombre }}</strong>
        <small>{{ rol }}</small>
      </div>
    </div>

    <button
      class="logout-btn"
      (click)="logout()">

      Cerrar Sesión

    </button>

  </div>

</div>
